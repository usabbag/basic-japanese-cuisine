<h1>Gunkan<br><small>軍艦 · battleship</small></h1>

<ul>
  <li>15–18 g rice, low and wide.</li>
  <li>Keep the nori in the bamboo mat so it stays dry. Stick it to 2/3, leave 1/3 empty; stretch the nori if needed.</li>
  <li>Wasabi on top or inside (inside preferred).</li>
</ul>
