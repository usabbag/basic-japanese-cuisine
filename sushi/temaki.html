<h1>Temaki<br><small>手巻き · hand roll</small></h1>

<ul>
  <li>30 g rice.</li>
  <li>Left hand dry; hold the nori with the fingertips. Place rice diagonally, top-left to bottom-right.</li>
  <li>Fold bottom-left to the top edge. A grain of rice closes it.</li>
</ul>
